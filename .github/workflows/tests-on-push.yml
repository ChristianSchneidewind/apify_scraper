name: Tests (push only)

on:
  push:
    branches:
      - '**'

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests main.py

      - name: Validate actor output schemas
        run: python .github/scripts/validate_actor_schemas.py

      - name: Run Python tests with coverage
        run: pytest -q --cov=src --cov-report=term-missing --cov-fail-under=70

  typescript-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run TypeScript lint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run TypeScript tests with coverage
        run: npm run test:coverage

      - name: Run TypeScript guardrails
        run: CI=1 npm run guardrails
