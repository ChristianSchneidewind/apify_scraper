name: Perf guardrail (manual)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Instagram post URL'
        required: true
        type: string
      runs:
        description: 'Measured runs'
        required: false
        default: '2'
        type: string
      warmup_runs:
        description: 'Warmup runs'
        required: false
        default: '1'
        type: string
      max_comments:
        description: 'Max comments per run'
        required: false
        default: '10'
        type: string
      max_avg_elapsed_secs:
        description: 'Fail if avg elapsed exceeds this'
        required: false
        default: '600'
        type: string

jobs:
  perf-guardrail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          playwright install chromium

      - name: Run benchmark
        run: |
          python tools/benchmark_runner.py \
            --url "${{ inputs.url }}" \
            --runs "${{ inputs.runs }}" \
            --warmup-runs "${{ inputs.warmup_runs }}" \
            --max-comments "${{ inputs.max_comments }}" \
            --python python \
            --out storage/benchmarks/ci-latest.json

      - name: Evaluate guardrail
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('storage/benchmarks/ci-latest.json')
          report = json.loads(p.read_text(encoding='utf-8'))

          max_avg = float('${{ inputs.max_avg_elapsed_secs }}')
          avg = report.get('avg_elapsed_secs')
          valid_runs = int(report.get('valid_runs') or 0)
          expected_runs = int(report.get('runs') or 0)

          if avg is None:
            raise SystemExit('Guardrail failed: avg_elapsed_secs is null (no valid measured runs).')
          if valid_runs < expected_runs:
            raise SystemExit(f'Guardrail failed: valid_runs={valid_runs} < runs={expected_runs}.')
          if float(avg) > max_avg:
            raise SystemExit(f'Guardrail failed: avg_elapsed_secs={avg} > threshold={max_avg}.')

          print(f'Guardrail passed: avg_elapsed_secs={avg}, valid_runs={valid_runs}/{expected_runs}')
          PY
